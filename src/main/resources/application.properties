spring.application.name=PTC2026

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}
spring.jpa.database-platform=${DB_DIALECT}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Misma firma que la API-AUTH: aqui el token solo se valida, nunca se emite.
app.jwt.secret=${JWT_SECRET}

# Origenes autorizados (sitio web y app movil), separados por coma.
app.cors.origenes=${CORS_ORIGINS}

# Almacenamiento de imagenes; la BD solo guarda la URL devuelta.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
