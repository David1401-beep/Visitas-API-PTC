spring.application.name=PTC2026

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}
spring.jpa.database-platform=${DB_DIALECT}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Con esta firma se emite y se valida el token.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Origenes autorizados (sitio web y app movil), separados por coma.
app.cors.origenes=${CORS_ORIGINS}

# Secure=true exige HTTPS; en local queda en false y en produccion se activa.
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# Almacenamiento de imagenes; la BD solo guarda la URL devuelta.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Correo para mandar el codigo de recuperacion.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.remitente=${MAIL_REMITENTE:}

# Vida del codigo de recuperacion y cuantos intentos se permiten.
app.recuperacion.minutos=${RECUPERACION_MINUTOS:10}
app.recuperacion.intentos=${RECUPERACION_INTENTOS:3}
