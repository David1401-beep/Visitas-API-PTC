# Configuracion solo para las pruebas.
#
# En las pruebas no se carga el .env, asi que aqui van valores propios.
# Se usa una base en memoria para que el proyecto compile sin Oracle:
# Heroku corre las pruebas al construir y alla no hay base.

spring.datasource.url=jdbc:h2:mem:pruebas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Cualquier texto sirve, pero debe pasar de 32 caracteres.
app.jwt.secret=secreto-solo-para-pruebas-no-se-usa-en-produccion
app.jwt.expiration-ms=900000

app.cors.origenes=http://localhost

app.cookie.secure=false
app.cookie.same-site=Lax

app.recuperacion.minutos=10
app.recuperacion.intentos=3

# Vacios a proposito: las pruebas no mandan correos ni suben imagenes.
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
app.mail.remitente=

cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=
